name: imager

# Builds a custom Talos imager against the patched kernel, then uses it to
# produce the rpi_5 metal image and installer for Raspberry Pi 5.
#
# Versions live in versions.yml and are bumped by Renovate. A push to that
# file triggers a build; workflow_dispatch inputs override it for one-offs.
#
# Checks out UPSTREAM siderolabs/talos — no fork needed, since the only
# customisation is PKG_KERNEL.
#
# Runs on arm64 runners throughout: the `images` job executes the imager
# binary, so it must match the runner architecture.
#
# All ghcr packages must be PUBLIC — the imager pulls anonymously from
# inside its container, and the Pi pulls the installer with no credentials.

on:
  push:
    paths:
      - versions.yml
      - .github/workflows/imager.yml
  workflow_dispatch:
    inputs:
      talos_version:
        description: "Override Talos tag (blank = use versions.yml)"
        required: false
        type: string
        default: ""
      kernel_image:
        description: "Override kernel manifest (blank = use versions.yml)"
        required: false
        type: string
        default: ""
      overlay_image:
        description: "Override rpi_5 overlay (blank = use versions.yml)"
        required: false
        type: string
        default: ""

permissions:
  contents: write        # write: needed to publish the Release
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  config:
    runs-on: ubuntu-latest
    outputs:
      talos_version: ${{ steps.cfg.outputs.talos_version }}
      kernel_image: ${{ steps.cfg.outputs.kernel_image }}
      overlay_image: ${{ steps.cfg.outputs.overlay_image }}
      extensions: ${{ steps.cfg.outputs.extensions }}
      config_txt_append: ${{ steps.cfg.outputs.config_txt_append }}
      owner: ${{ steps.cfg.outputs.owner }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve configuration
        id: cfg
        run: |
          set -euo pipefail

          # Inputs win over versions.yml so a dispatch can pin anything.
          TALOS="${{ inputs.talos_version }}"
          [ -n "$TALOS" ] || TALOS=$(yq -r '.talos_version' versions.yml)

          KERNEL="${{ inputs.kernel_image }}"
          [ -n "$KERNEL" ] || KERNEL=$(yq -r '.kernel_image' versions.yml)

          OVERLAY="${{ inputs.overlay_image }}"
          [ -n "$OVERLAY" ] || OVERLAY=$(yq -r '.overlay_image' versions.yml)

          # Extensions and the config.txt append line also live in versions.yml
          # so Renovate can bump extension versions too.
          EXT=$(yq -r '.extensions[] | "--system-extension-image " + .' versions.yml | tr '\n' ' ')
          APPEND=$(yq -r '.config_txt_append' versions.yml)

          {
            echo "talos_version=${TALOS}"
            echo "kernel_image=${KERNEL}"
            echo "overlay_image=${OVERLAY}"
            echo "extensions=${EXT}"
            echo "config_txt_append=${APPEND}"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build configuration"
            echo ""
            echo "| key | value |"
            echo "|---|---|"
            echo "| talos | \`${TALOS}\` |"
            echo "| kernel | \`${KERNEL}\` |"
            echo "| overlay | \`${OVERLAY}\` |"
            echo "| configTxtAppend | \`${APPEND}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verify kernel image exists and is multi-arch
        run: |
          set -euo pipefail
          go install github.com/google/go-containerregistry/cmd/crane@latest
          export PATH="$PATH:$(go env GOPATH)/bin"

          KERNEL='${{ steps.cfg.outputs.kernel_image }}'
          # Fails loudly here rather than 40 minutes into the imager build.
          PLATFORMS=$(crane manifest "$KERNEL" | jq -r '.manifests[].platform.architecture' | sort | tr '\n' ' ')
          echo "kernel platforms: ${PLATFORMS}"
          case "$PLATFORMS" in
            *amd64*arm64*) ;;
            *) echo "::error::kernel manifest is not multi-arch: ${PLATFORMS}"; exit 1 ;;
          esac

  imager:
    needs: config
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.alias.outputs.image }}
      talos_sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: siderolabs/talos
          ref: ${{ needs.config.outputs.talos_version }}
          fetch-depth: 0

      - name: Record upstream commit
        id: rev
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      # Cross-check: the kernel must have been built from the pkgs tag this
      # Talos release pins, or the imager assembles mismatched components.
      - name: Report pinned pkgs tag
        run: |
          PKGS=$(grep '^PKGS ?=' Makefile | awk '{print $3}')
          echo "Talos ${{ needs.config.outputs.talos_version }} pins PKGS=${PKGS}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The imager bakes ghcr.io/<owner>/installer-base:<TAG> into its profile,
      # so that image must exist in the same namespace with the same TAG.
      - name: Build installer-base
        run: |
          make installer-base \
            PLATFORM=linux/arm64 \
            PUSH=true \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ needs.config.outputs.owner }} \
            TAG=${{ needs.config.outputs.talos_version }} \
            PKG_KERNEL=${{ needs.config.outputs.kernel_image }}

      # TAG becomes the Talos version embedded in the imager profile and is
      # parsed as semver during extension validation — it must stay clean.
      - name: Build imager
        run: |
          make imager \
            PLATFORM=linux/arm64 \
            PUSH=true \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ needs.config.outputs.owner }} \
            TAG=${{ needs.config.outputs.talos_version }} \
            PKG_KERNEL=${{ needs.config.outputs.kernel_image }}

      # Registry-side re-tagging: no pull, no re-push.
      - name: Tag imager aliases
        id: alias
        run: |
          IMG="${{ env.REGISTRY }}/${{ needs.config.outputs.owner }}/imager"
          V="${{ needs.config.outputs.talos_version }}"
          SHA="${{ steps.rev.outputs.sha }}"
          RUN="${{ github.run_number }}"

          docker buildx imagetools create \
            -t "${IMG}:${V}-rp1pwm-${RUN}" \
            -t "${IMG}:${V}-${SHA}" \
            -t "${IMG}:${V}-rp1pwm" \
            "${IMG}:${V}"

          echo "image=${IMG}:${V}-rp1pwm-${RUN}" >> "$GITHUB_OUTPUT"

      - name: Show manifest
        run: docker buildx imagetools inspect ${{ steps.alias.outputs.image }}

  images:
    needs: [config, imager]
    runs-on: ubuntu-24.04-arm
    outputs:
      installer: ${{ steps.push.outputs.installer }}
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # NOTE: the positional argument is the overlay's own profile (rpi_5),
      # NOT `metal`. With `metal` the Pi-specific boot artifacts (config.txt,
      # u-boot.bin, the DTBs) are never written and the card will not boot.
      - name: Generate metal image
        run: |
          mkdir -p _out
          docker run --rm -t --privileged \
            -v "$PWD/_out:/out" -v /dev:/dev \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            ${{ needs.imager.outputs.image }} rpi_5 \
            --arch arm64 \
            --overlay-name rpi_5 \
            --overlay-image ${{ needs.config.outputs.overlay_image }} \
            --overlay-option configTxtAppend=${{ needs.config.outputs.config_txt_append }} \
            ${{ needs.config.outputs.extensions }}
          ls -lh _out

      - name: Generate installer
        run: |
          docker run --rm -t --privileged \
            -v "$PWD/_out:/out" -v /dev:/dev \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            ${{ needs.imager.outputs.image }} installer \
            --arch arm64 \
            --overlay-name rpi_5 \
            --overlay-image ${{ needs.config.outputs.overlay_image }} \
            --overlay-option configTxtAppend=${{ needs.config.outputs.config_txt_append }} \
            ${{ needs.config.outputs.extensions }}
          ls -lh _out

      - name: Push installer
        id: push
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ needs.config.outputs.owner }}/installer"
          V="${{ needs.config.outputs.talos_version }}"
          SHA="${{ needs.imager.outputs.talos_sha }}"
          RUN="${{ github.run_number }}"

          crane push _out/installer-arm64.tar "${IMG}:${V}-rp1pwm-${RUN}"
          crane tag "${IMG}:${V}-rp1pwm-${RUN}" "${V}-${SHA}"
          crane tag "${IMG}:${V}-rp1pwm-${RUN}" "${V}-rp1pwm"

          echo "installer=${IMG}:${V}-rp1pwm-${RUN}" >> "$GITHUB_OUTPUT"

      # Confirms the fan workaround travels with the installer, so it is
      # re-applied on every `talosctl upgrade` rather than only at flash time.
      - name: Verify configTxtAppend landed in the installer
        run: |
          set -euo pipefail
          OPTS=$(crane export "${{ steps.push.outputs.installer }}" - | tar xO overlay/extra-options)
          echo "$OPTS"
          echo "$OPTS" | grep -q 'configTxtAppend' \
            || { echo "::error::configTxtAppend missing from installer"; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.config.outputs.talos_version }}-rp1pwm-${{ github.run_number }}
          name: "Talos ${{ needs.config.outputs.talos_version }} rpi_5 (RP1 PWM) #${{ github.run_number }}"
          files: _out/metal-arm64.raw.*
          body: |
            Raspberry Pi 5 image with the RP1 PWM driver (v7 series) and the
            `dtparam=fan_temp0` workaround baked into `config.txt`.

            **Flash:**
            ```
            xz -dc metal-arm64.raw.xz | sudo dd of=/dev/<sdcard> bs=4M status=progress conv=fsync
            ```

            **Pin in `machine.install.image`:**
            ```
            ${{ steps.push.outputs.installer }}
            ```

            | component | version |
            |---|---|
            | talos | `${{ needs.config.outputs.talos_version }}` |
            | kernel | `${{ needs.config.outputs.kernel_image }}` |
            | overlay | `${{ needs.config.outputs.overlay_image }}` |
