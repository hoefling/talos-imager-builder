name: imager

# Builds a custom Talos imager against the patched kernel, then uses it to
# produce the rpi_5 metal image and installer for Raspberry Pi 5.
#
# Versions live in versions.yml and are bumped by Renovate.
#   pull_request -> validation only (cheap, catches a bad kernel/Talos pairing
#                   before merge)
#   push to main -> full build and publish
#   dispatch     -> full build with optional overrides
#
# Checks out UPSTREAM siderolabs/talos — no fork needed, since the only
# customisation is PKG_KERNEL.
#
# The imager and images jobs run on arm64 runners: the images job executes
# the imager binary, so it must match the runner architecture.
#
# All ghcr packages must be PUBLIC — the imager pulls anonymously from inside
# its container, and the Pi pulls the installer with no credentials.

on:
  push:
    branches: [main]
    paths:
      - versions.yml
      - .github/workflows/imager.yml
  pull_request:
    paths:
      - versions.yml
      - .github/workflows/imager.yml
  workflow_dispatch:
    inputs:
      talos_version:
        description: "Override Talos tag (blank = use versions.yml)"
        required: false
        type: string
        default: ""
      kernel_image:
        description: "Override kernel manifest (blank = use versions.yml)"
        required: false
        type: string
        default: ""
      overlay_image:
        description: "Override rpi_5 overlay (blank = use versions.yml)"
        required: false
        type: string
        default: ""
      skip_pkgs_check:
        description: "Skip the kernel/Talos pkgs-base cross-check"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  packages: read

concurrency:
  group: imager-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  # Runs on every trigger, including pull requests. Seconds of runtime, and
  # it catches "bumped Talos but forgot to rebase/tag the kernel" while the
  # PR is still open.
  config:
    runs-on: ubuntu-latest
    outputs:
      talos_version: ${{ steps.cfg.outputs.talos_version }}
      kernel_image: ${{ steps.cfg.outputs.kernel_image }}
      overlay_image: ${{ steps.cfg.outputs.overlay_image }}
      extensions: ${{ steps.cfg.outputs.extensions }}
      config_txt_append: ${{ steps.cfg.outputs.config_txt_append }}
      owner: ${{ steps.cfg.outputs.owner }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Resolve configuration
        id: cfg
        run: |
          set -euo pipefail

          # Dispatch inputs win over versions.yml so a manual run can pin
          # anything without editing the file.
          TALOS="${{ inputs.talos_version }}"
          [ -n "$TALOS" ] || TALOS=$(yq -r '.talos_version' versions.yml)

          KERNEL="${{ inputs.kernel_image }}"
          [ -n "$KERNEL" ] || KERNEL=$(yq -r '.kernel_image' versions.yml)

          OVERLAY="${{ inputs.overlay_image }}"
          [ -n "$OVERLAY" ] || OVERLAY=$(yq -r '.overlay_image' versions.yml)

          # Userspace extensions: versioned independently, pinned in the file.
          EXT=$(yq -r '.extensions[] | "--system-extension-image " + .' versions.yml | tr '\n' ' ')

          # Extensions that ship kernel modules must match the Talos kernel
          # exactly, so their tag is derived rather than pinned. Listing one
          # with a tag in versions.yml is how vc4:v1.13.8 ended up against a
          # 6.18.44 kernel.
          KEXT=$(TALOS="$TALOS" yq -r \
            '.kernel_extensions[]? | "--system-extension-image " + . + ":" + strenv(TALOS)' \
            versions.yml | tr '\n' ' ')

          EXT="${EXT}${KEXT}"

          APPEND=$(yq -r '.config_txt_append' versions.yml)

          {
            echo "talos_version=${TALOS}"
            echo "kernel_image=${KERNEL}"
            echo "overlay_image=${OVERLAY}"
            echo "extensions=${EXT}"
            echo "config_txt_append=${APPEND}"
            echo "owner=${GITHUB_REPOSITORY_OWNER,,}"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Build configuration"
            echo ""
            echo "| key | value |"
            echo "|---|---|"
            echo "| talos | \`${TALOS}\` |"
            echo "| kernel | \`${KERNEL}\` |"
            echo "| overlay | \`${OVERLAY}\` |"
            echo "| extensions | \`${EXT}\` |"
            echo "| configTxtAppend | \`${APPEND}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # Fails here in seconds rather than 40 minutes into the imager build.
      - name: Verify kernel image exists and is multi-arch
        run: |
          set -euo pipefail
          KERNEL='${{ steps.cfg.outputs.kernel_image }}'

          crane manifest "$KERNEL" > /tmp/manifest.json \
            || { echo "::error::kernel image not found: ${KERNEL} — was the pkgs tag pushed?"; exit 1; }

          MEDIA=$(jq -r '.mediaType // "unknown"' /tmp/manifest.json)
          # `[]?` tolerates a single-image manifest, which has no .manifests
          # key at all — that is a real failure, not a jq error.
          PLATFORMS=$(jq -r '[.manifests[]?.platform.architecture] | join(" ")' /tmp/manifest.json)

          echo "mediaType: ${MEDIA}"
          echo "platforms: ${PLATFORMS}"

          MISSING=""
          case " $PLATFORMS " in *" amd64 "*) ;; *) MISSING="amd64" ;; esac
          case " $PLATFORMS " in *" arm64 "*) ;; *) MISSING="${MISSING} arm64" ;; esac
          [ -z "$MISSING" ] || {
            echo "::error::${KERNEL} is not multi-arch (mediaType=${MEDIA}, platforms='${PLATFORMS}', missing:${MISSING}). Did you tag a per-arch child instead of the index?"
            exit 1
          }

          BASE=$(jq -r '.annotations["dev.hoefling.pkgs-base"] // "unknown"' /tmp/manifest.json)
          LINUX=$(jq -r '.annotations["dev.hoefling.linux-version"] // "unknown"' /tmp/manifest.json)
          {
            echo "| kernel pkgs base | \`${BASE}\` |"
            echo "| kernel linux | \`${LINUX}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The pairing that produced mismatched-component builds before: the
      # kernel must come from the pkgs commit this Talos release pins.
      #
      # Both sides are `git describe` strings, but the abbreviation length
      # differs (Talos uses git's default, the kernel workflow may not), so
      # the tag part is compared exactly and the SHA part by prefix.
      - name: Compare pkgs base against Talos PKGS
        if: ${{ !inputs.skip_pkgs_check }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TALOS='${{ steps.cfg.outputs.talos_version }}'
          BASE=$(jq -r '.annotations["dev.hoefling.pkgs-base"] // "unknown"' /tmp/manifest.json)

          PKGS=$(gh api "repos/siderolabs/talos/contents/Makefile?ref=${TALOS}" --jq '.content' \
                   | base64 -d | grep '^PKGS ?=' | awk '{print $3}')
          echo "Talos ${TALOS} pins PKGS=${PKGS}"
          echo "kernel built from   ${BASE}"

          if [ "$BASE" = "unknown" ]; then
            echo "::warning::kernel image carries no pkgs-base annotation; cannot cross-check"
            exit 0
          fi

          # v1.13.0-60-gf541ca434ee6  ->  tag=v1.13.0-60  sha=f541ca434ee6
          BASE_TAG="${BASE%-g*}";  BASE_SHA="${BASE##*-g}"
          PKGS_TAG="${PKGS%-g*}";  PKGS_SHA="${PKGS##*-g}"

          fail() {
            echo "::error::kernel built from ${BASE}, Talos ${TALOS} pins ${PKGS} — rebase the pkgs fork onto ${PKGS_SHA} and re-tag"
            exit 1
          }

          [ "$BASE_TAG" = "$PKGS_TAG" ] || fail

          # One SHA is an abbreviation of the other; compare in whichever
          # direction is shorter.
          case "$BASE_SHA" in
            "$PKGS_SHA"*) ;;
            *) case "$PKGS_SHA" in
                 "$BASE_SHA"*) ;;
                 *) fail ;;
               esac ;;
          esac

          echo "pkgs base matches"
          echo "| pkgs base check | matches \`${PKGS}\` |" >> "$GITHUB_STEP_SUMMARY"

  imager:
    needs: config
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.alias.outputs.image }}
      talos_sha: ${{ steps.rev.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: siderolabs/talos
          ref: ${{ needs.config.outputs.talos_version }}
          fetch-depth: 0

      - name: Record upstream commit
        id: rev
        run: echo "sha=$(git rev-parse --short=12 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The imager bakes ghcr.io/<owner>/installer-base:<TAG> into its profile,
      # so that image must exist in the same namespace with the same TAG.
      - name: Build installer-base
        run: |
          make installer-base \
            PLATFORM=linux/arm64 \
            PUSH=true \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ needs.config.outputs.owner }} \
            TAG=${{ needs.config.outputs.talos_version }} \
            PKG_KERNEL=${{ needs.config.outputs.kernel_image }}

      # TAG becomes the Talos version embedded in the imager profile and is
      # parsed as semver during extension validation — it must stay clean.
      - name: Build imager
        run: |
          make imager \
            PLATFORM=linux/arm64 \
            PUSH=true \
            REGISTRY=${{ env.REGISTRY }} \
            USERNAME=${{ needs.config.outputs.owner }} \
            TAG=${{ needs.config.outputs.talos_version }} \
            PKG_KERNEL=${{ needs.config.outputs.kernel_image }}

      # Registry-side re-tagging: no pull, no re-push.
      - name: Tag imager aliases
        id: alias
        run: |
          IMG="${{ env.REGISTRY }}/${{ needs.config.outputs.owner }}/imager"
          V="${{ needs.config.outputs.talos_version }}"
          SHA="${{ steps.rev.outputs.sha }}"
          RUN="${{ github.run_number }}"

          docker buildx imagetools create \
            -t "${IMG}:${V}-rp1pwm-${RUN}" \
            -t "${IMG}:${V}-${SHA}" \
            -t "${IMG}:${V}-rp1pwm" \
            "${IMG}:${V}"

          echo "image=${IMG}:${V}-rp1pwm-${RUN}" >> "$GITHUB_OUTPUT"

      - name: Show manifest
        run: docker buildx imagetools inspect ${{ steps.alias.outputs.image }}

  images:
    needs: [config, imager]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write        # publish the Release
      packages: write
    steps:
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install crane
        run: |
          go install github.com/google/go-containerregistry/cmd/crane@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      # NOTE: the positional argument is the overlay's own profile (rpi_5),
      # NOT `metal`. With `metal` the Pi-specific boot artifacts (config.txt,
      # u-boot.bin, the DTBs) are never written and the card will not boot.
      - name: Generate metal image
        run: |
          mkdir -p _out
          docker run --rm -t --privileged \
            -v "$PWD/_out:/out" -v /dev:/dev \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            ${{ needs.imager.outputs.image }} rpi_5 \
            --arch arm64 \
            --overlay-name rpi_5 \
            --overlay-image ${{ needs.config.outputs.overlay_image }} \
            --overlay-option configTxtAppend=${{ needs.config.outputs.config_txt_append }} \
            ${{ needs.config.outputs.extensions }}
          ls -lh _out

      - name: Generate installer
        run: |
          docker run --rm -t --privileged \
            -v "$PWD/_out:/out" -v /dev:/dev \
            -v "$HOME/.docker/config.json:/root/.docker/config.json:ro" \
            ${{ needs.imager.outputs.image }} installer \
            --arch arm64 \
            --overlay-name rpi_5 \
            --overlay-image ${{ needs.config.outputs.overlay_image }} \
            --overlay-option configTxtAppend=${{ needs.config.outputs.config_txt_append }} \
            ${{ needs.config.outputs.extensions }}
          ls -lh _out

      - name: Push installer
        id: push
        run: |
          set -euo pipefail
          IMG="${{ env.REGISTRY }}/${{ needs.config.outputs.owner }}/installer"
          V="${{ needs.config.outputs.talos_version }}"
          SHA="${{ needs.imager.outputs.talos_sha }}"
          RUN="${{ github.run_number }}"

          crane push _out/installer-arm64.tar "${IMG}:${V}-rp1pwm-${RUN}"
          crane tag "${IMG}:${V}-rp1pwm-${RUN}" "${V}-${SHA}"
          crane tag "${IMG}:${V}-rp1pwm-${RUN}" "${V}-rp1pwm"

          echo "installer=${IMG}:${V}-rp1pwm-${RUN}" >> "$GITHUB_OUTPUT"

      # Confirms the fan workaround travels with the installer, so it is
      # re-applied on every `talosctl upgrade` rather than only at flash time.
      - name: Verify configTxtAppend landed in the installer
        run: |
          set -euo pipefail
          OPTS=$(crane export "${{ steps.push.outputs.installer }}" - | tar xO overlay/extra-options)
          echo "$OPTS"
          echo "$OPTS" | grep -q 'configTxtAppend' \
            || { echo "::error::configTxtAppend missing from installer"; exit 1; }

      - name: Publish release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.config.outputs.talos_version }}-rp1pwm-${{ github.run_number }}
          name: "Talos ${{ needs.config.outputs.talos_version }} rpi_5 (RP1 PWM) #${{ github.run_number }}"
          files: _out/metal-arm64.raw.*
          body: |
            Raspberry Pi 5 image with the RP1 PWM driver (v7 series) and the
            `dtparam=fan_temp0` workaround baked into `config.txt`.

            **Flash:**
            ```
            xz -dc metal-arm64.raw.xz | sudo dd of=/dev/<sdcard> bs=4M status=progress conv=fsync
            ```

            **Pin in `machine.install.image`:**
            ```
            ${{ steps.push.outputs.installer }}
            ```

            | component | version |
            |---|---|
            | talos | `${{ needs.config.outputs.talos_version }}` |
            | kernel | `${{ needs.config.outputs.kernel_image }}` |
            | overlay | `${{ needs.config.outputs.overlay_image }}` |
